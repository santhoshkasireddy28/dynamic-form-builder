<div>
    <div class="flex items-center justify-between">
        <h3 class="font-medium text-gray-700">{{title()}}</h3>
        <button mat-icon-button (click)="addOption()">
            <mat-icon>add_circle</mat-icon>
        </button>
    </div>
    <div class="flex flex-col gap-2 mt-2">
       @for(option of options(); track option.value; let i = $index) {
            <div class="flex items-center gap-2">
                <mat-form-field class="flex-1 compact">
                    <input matInput [(ngModel)]="option.label" (ngModelChange)="updateOption(i,$event)" placeholder="Option label">
                </mat-form-field>
                <button mat-icon-button (click)="removeOption(i)">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
}
</div>
</div>
